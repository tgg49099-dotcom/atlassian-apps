# Recette appliquee par la mere le 26/10/2026 (recette mesuree du slot 5, qui publie) :
#   IntelliJ Platform Gradle Plugin 2.7.2 + Kotlin 1.9.25 + Java 17 + IDE 2024.3 + JDK 21.
# Raison : Kotlin 2.3.0 + JDK 25.0.5 -> java.lang.IllegalArgumentException: 25.0.5
# (le parseur JavaVersion embarque dans le compilateur Kotlin ne sait pas lire "25.0.5").
# Conteneur RAM 1.5 Go : garder -Xmx300m (un depassement = cycle tue en code 137).
org.gradle.jvmargs=-Xmx300m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false
kotlin.code.style=official
org.gradle.java.home=/work/tools/jdk
org.gradle.java.installations.paths=/work/tools/jdk
kotlin.daemon.jvmargs=-Xmx200m
platformVersion = 2024.3
platformType = IC
pluginSinceBuild = 243
pluginUntilBuild = 263.*
pluginVersion = 0.3.0
# 27/10/2026 (consigne de la mere, point 4) : le stdlib Kotlin est fourni par l'IDE
# (il est dans lib/util-8.jar de l'IDE). L'embarquer dans le ZIP provoque des
# avertissements du Plugin Verifier et des conflits de classes : on ne le bundle pas.
# Les deux modules le Declare explicitement en `compileOnly` pour pouvoir compiler.
kotlin.stdlib.default.dependency=false
