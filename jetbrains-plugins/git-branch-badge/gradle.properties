# Git Branch Badge — métadonnées du build.
#
# Le nom public du plugin et son prix sont decisions par le proprietaire
# (la "mere" du slot 5). Ce qui suit est un NOM DE TRAVAIL : il doit etre
# change AVANT toute publication, car l'identifiant du plugin (`id`) est
# definitif une fois le plugin publie sur la Marketplace.
#
# See /work/produits/BrancheProjectView/NOTES.md (recette de publication).

pluginGroupId = com.tgglabs.branchbadge
pluginName = Git Branch Badge
pluginVersion = 0.0.1

# Plancher 243 = 2024.3 (IDE de compilation et de test) ; plafond 263.* = 2026.3.
# Meme plage que le plugin 35416 deja verifie (PY-243.21565.199 -> PY-262.8665.309).
pluginSinceBuild = 243
pluginUntilBuild = 263.*

# IDE de compilation. 2024.3 est DEJA dans le cache Gradle du conteneur
# (~/.gradle/caches/modules-2/files-2.1/python/pycharm-professional/2024.3) :
# le build ne telecharge donc rien et ne consomme pas de disque.
platformVersion = 2024.3
platformType = PY

pluginVendorName = Tgg Labs
pluginVendorEmail = tgg.apps.support@gmail.com
pluginVendorUrl = https://plugins.jetbrains.com/vendor/tgg-labs

org.gradle.jvmargs = -Xmx900m -Dfile.encoding=UTF-8
org.gradle.parallel = true
org.gradle.caching = true
