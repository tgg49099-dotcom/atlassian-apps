# ML Experiment Cockpit plugin metadata.
# Owned by the Slot 5 vendor on JetBrains Marketplace.
# Vendor name is configured at upload time via the vendor profile on plugins.jetbrains.com.

pluginGroupId = com.tgglabs.mlexp
pluginName = ML Experiment Cockpit
pluginSlug = ml-experiment-cockpit
# 07/11/2026 (cycle 149) : 0.0.21 -> 0.0.22 — palier Pro n°1 « Compare 2 runs ».
# La version publiee du plugin gratuit reste sur la serie 0.0.x ; le palier
# payant est un ABONNEMENT vendu par JetBrains (code produit PPCOCKPITPRO),
# pas une version payante a part entiere. Le `<product-descriptor>` porte
# donc la date de la release payante (release-date / release-version).
pluginVersion = 0.0.22
# 07/11/2026 (cycle 150) : version AFFICHEE et VENDUE du plugin.
# La regle officielle « add-required-parameters » impose que les 2 premiers
# chiffres du `release-version` correspondent a ceux du `version` :
# `release-version="20261"` => le `version` doit etre `2026.1.x`.
# Donc DEUX versions coexistent :
#   - pluginVersion           = 0.0.22   -> nom du ZIP livre
#                                  (ml-experiment-cockpit-0.0.22.zip)
#   - pluginMarketplaceVersion = 2026.1.0 -> balise <version> du plugin.xml
#                                  ET nom du JAR interne du ZIP
#                                  (ml-experiment-cockpit-2026.1.0.jar)
# MESURE (cycle 150) : le patcher de la plateforme INTELLIJ PLATFORM GRADLE
# PLUGIN 2.7.2 (`pluginConfiguration.version`) ECRASE la balise <version>
# presente dans les sources : ajouter <version>2026.1.0</version> dans
# src/main/resources/META-INF/plugin.xml ne suffit donc PAS, il faut que
# `pluginConfiguration.version` vaille 2026.1.0.
# MESURE (cycle 150, 2e probe) : si `pluginConfiguration.version` n'est pas
# pose, le patcher retombe sur `project.version` (0.0.22) et ecrase quand
# meme la balise <version> des sources.
pluginMarketplaceVersion = 2026.1.0
pluginSinceBuild = 243
# Latest stable PyCharm as of October 2026 is 2026.2. The REAL build number is
# 262.8665.309 -- read it from the IDE's own build.txt, do not guess it:
#   cat <ide-dir>/build.txt   ->  PY-262.8665.309
# (an earlier comment here claimed 262.10968.92; that number does not exist
# and was corrected on 23/10/2026 after the Plugin Verifier run of cycle 44).
# The JetBrains Plugin Verifier requires untilBuild to be a real version
# (empty / 999.* / "magic" values are rejected) and recommends the latest
# available IDE. Bump when the next stable ships.
# Verified compatible on both ends of the range (cycle 44):
#   PY-243.21565.199 (2024.3, floor) and PY-262.8665.309 (2026.2, ceiling).
# 24/10/2026 (cycle 51) : the ceiling moves 262.* -> 263.*. The stable IDE is
# still 2026.2 (build 262) but 2026.3 (build 263) is EAP since 23/10/2026 and
# becomes stable in ~3 weeks: with a 262.* ceiling the plugin would stop
# installing for every new user from that day on. 263.* still accepts the
# current stable 262 (262 is inside [243, 263.*]).
# Source : https://plugins.jetbrains.com/docs/intellij/plugin-compatibility.html
pluginUntilBuild = 263.*

# Target IDEs: PyCharm Professional (PY) is the primary IDE for ML workflows.
# DataSpell (DS) is JetBrains' dedicated data-science IDE.
# We target both so a single JAR ships to the whole ML/data-science audience.
# For local MVP we keep platformVersion = 2024.3 to match the validated baseline
# from /work/hello-world-plugin (proven to pass `verifyPlugin`).
platformVersion = 2024.3
platformType = PY
# Optional second target (DataSpell). Uncomment to add a second IDE to the
# verification matrix (will roughly double the verifyPlugin duration).
# platformType = DS

platformDownloadSources = true

# Plugin Vendor info (overridden per vendor when published).
pluginVendorName = Tgg Labs
pluginVendorEmail = tgg.apps.support@gmail.com
pluginVendorUrl = https://plugins.jetbrains.com/vendor/tgg-labs

# Gradle configuration
org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel = true
org.gradle.caching = true