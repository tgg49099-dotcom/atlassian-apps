# Recette de build validée par la mère le 26/10/2026 (slot 3).
# Java 17 partout, Kotlin 1.9.25, plugin Gradle IntelliJ Platform 2.7.2.
org.gradle.java.home=/work/tools/jdk
org.gradle.jvmargs=-Xmx800m -XX:+UseSerialGC -Dfile.encoding=UTF-8
# Le daemon Kotlin séparé (200 Mo) a levé "out of JVM heap space" le 26/10 sur ce
# conteneur : on compile dans le JVM du build, une seule JVM en mémoire (plafond 1,5 Go).
kotlin.compiler.execution.strategy=in-process

# Le conteneur a un plafond mémoire de 1,5 Go : un seul build à la fois,
# pas de build parallèle, pas de daemon Gradle qui traîne en mémoire.
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.daemon=false
org.gradle.configureondemand=false

# La plateforme IntelliJ 2024.3 ne fournit PAS kotlin-stdlib à l'exécution (mesuré le
# 26/10 : il n'est que dans plugins/Kotlin/kotlinc/lib, le compilateur). Un plugin qui ne
# dépend que de com.intellij.modules.platform doit donc embarquer kotlin-stdlib, comme
# le fait le plugin « ML Experiment Cockpit » approuvé par JetBrains.
