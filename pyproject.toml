[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signedorders"
version = "0.2.0"
description = "A containment-first control plane for autonomous agents: signed orders, auditable rules, quotas, hash-chained journal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Signed Orders" }]
keywords = ["agent", "sandbox", "ed25519", "audit", "control-plane"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

# The core has NO third-party dependency: Ed25519 (RFC 8032) is implemented in
# pure Python, so `python3 -m signedorders verify journal.jsonl` works on a
# bare Python 3.10+ with nothing installed.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Optional: only used to cross-check the pure implementation in the tests.
reference = ["cryptography>=41.0"]

[project.scripts]
signedorders = "signedorders.cli:main"

[tool.setuptools]
packages = ["signedorders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
